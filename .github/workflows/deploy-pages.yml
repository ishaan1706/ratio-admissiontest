name: Deploy Ratio to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  # The Pages source is still "Deploy from a branch", whose build serves the
  # raw index.html. Redeploy the built app after every branch build lands.
  page_build:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for branch Pages build to finish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do
            n=$(gh run list -R "$GITHUB_REPOSITORY" -w "pages build and deployment" --json status --jq '[.[]|select(.status!="completed")]|length')
            [ "$n" = "0" ] && exit 0
            sleep 10
          done
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build static bundle
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
